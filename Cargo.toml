[package]
name = "registry-rust"
version = "0.8.2"
edition = "2024"

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
axum = "0.7"
axum-server = { version = "0.8", features = ["tls-rustls"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
futures-util = "0.3"
bytes = "1"
fs2 = "0.4"
headers = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
ipnet = "2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
semver = "1"
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
libc = "0.2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
acmecert-core = { path = "../acmecert/crates/acmecert-core" }

[features]
default = ["storage-fs"]
storage-fs = []
storage-s3 = []

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }

