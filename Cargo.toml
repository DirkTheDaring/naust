[package]
name = "naust"
version = "0.9.0"
edition = "2024"
description = "Naust — a self-hostable OCI/Docker container registry (Old Norse: the boathouse where vessels are stored)"
license = "MIT"
repository = "https://github.com/DirkTheDaring/naust"

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
axum = "0.7"
axum-server = { version = "0.8", features = ["tls-rustls"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
futures-util = "0.3"
bytes = "1"
fs2 = "0.4"
headers = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
ipnet = "2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
semver = "1"
sled = "0.34"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
subtle = "2"
libc = "0.2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
acmecert-core = { path = "vendor/acmecert/crates/acmecert-core" }
naust-core = { path = "vendor/naust-core" }
storage-core = { path = "vendor/storage-layer-rust/crates/storage-core" }
storage-fs = { path = "vendor/storage-layer-rust/crates/storage-fs" }
storage-s3 = { path = "vendor/storage-layer-rust/crates/storage-s3" }
x509-parser = "0.18.1"

[dev-dependencies]
naust-core = { path = "vendor/naust-core", features = ["test-mocks"] }
tempfile = "3"
http-body-util = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
rcgen = "0.14.10"

