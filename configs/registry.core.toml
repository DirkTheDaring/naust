# Core configuration for registry-rust (intended to be stable-ish).
# Layer this with an auth file:
#   ./registry-rust server \
#     --config /etc/registry/registry.core.toml \
#     --config /etc/registry/registry.auth.toml
# Precedence:
#   defaults < config files (in order) < env vars

[profile]
# Optional: "best_practice" changes defaults and makes token.signing_key required.
# name = "best_practice"
name = ""

[server]
listen_addr = "127.0.0.1:5000"
# Recommended for token realm and external URLs (especially behind proxies)
public_url = "http://127.0.0.1:5000"

[server.tls]
# If both are set, the server serves HTTPS.
cert_path = ""
key_path  = ""

# Optional: ACME DNS-01 certificate provisioning (writes cert.pem/key.pem to output_dir).
# When enabled:
# - If cert_path/key_path are unset, they default to <output_dir>/cert.pem and <output_dir>/key.pem.
# - If cert_path/key_path are set, they MUST match those generated paths.
#
# [server.tls.acme]
# enabled = false
# provider = "ispone" # or "exec_path"
# email = "admin@example.com"
# names = ["registry.example.com"]
# output_dir = "./data/acme/registry.example.com"
# allow_first_wildcard = false
# renewal_window_secs = 2592000  # 30 days
# proxy = ""                    # optional HTTP proxy URL
# debug = false
# propagation_check_disabled = false
# propagation_check_strict = false
#
# [server.tls.acme.ispone]
# base_url = "https://ispone-bridge.example.com"
# authorization = "Bearer <token>"
#
# [server.tls.acme.exec_path]
# exec_path = "/usr/local/bin/acme-dns-hook"

[token]
service = "registry-rust"
# Token TTL in seconds.
ttl_secs = 600
# Set a stable secret in production.
# Overlap key rotation (recommended): provide multiple keys.
# - The FIRST entry is the primary key used to mint new tokens.
# - All entries are accepted for verification, so you can rotate without breaking in-flight tokens.
[[token.signing_keys]]
kid = "k2026_01"
key = "change-me-primary"

[[token.signing_keys]]
kid = "k2025_12"
key = "change-me-secondary"

# Legacy single-key config (still supported):
# signing_key = "change-me"

[storage]
backend = "fs"  # "fs" or "s3"

# Persistent blob reference index (sled on local disk).
# Enabled by default even if you omit this block.
[storage.ref_index]
enabled = true
# path = "./data/ref-index"
# rebuild_on_start = false
# auto_rebuild_on_corruption = true

# Online blob GC (in-process, safe-by-default)
#
# This is the *online* GC described in docs/blob-gc-online.md, driven via admin-only HTTP endpoints.
# It is disabled by default.
#
# Notes:
# - Only applies to filesystem backend.
# - Quarantine/delete phases are gated by `enabled` / `enable_delete`.
# - Admin endpoints use these defaults when request fields are omitted.
[blob_gc]
# enabled: allows the *quarantine* phase (moves unreferenced blobs from live -> quarantine).
# When false: admin GC "plan" remains available, but quarantine/delete are blocked.
# enabled = false
# enable_delete: additionally allows the *delete* phase (permanently deletes old quarantined blobs).
# When false: /_admin/gc/delete is blocked and scheduled cleanup (if enabled) will quarantine only.
# enable_delete = false
#
# Safety: newly finalized blobs are pinned for at least this long.
# finalize_grace_secs = 259200 # 72h
#
# Default policy knobs (used by admin endpoints if omitted in request JSON)
# default_min_age_secs = 604800             # 7d
# default_quarantine_delay_secs = 86400     # 24h
#
# Default per-run budgets (used by admin endpoints if omitted)
# default_max_blobs = 1000
# default_max_bytes = 9223372036854775807  # i64::MAX (TOML ints are i64)
# default_max_seconds = 60

# Optional: run scheduled cleanup in the background (server only).
# When enabled, the server triggers online GC periodically using the defaults above.
# schedule_enabled = false
# schedule_interval_secs = 604800 # 7d

# Admin-only HTTP endpoints (disabled by default)
#
# Enables:
# - GET  /_admin/gc/health
# - POST /_admin/gc/plan
# - POST /_admin/gc/quarantine
# - POST /_admin/gc/delete
[admin_api]
# enabled = false
# username = "admin"
# password = "change-me"

[storage.fs]
root = "./data"

[storage.s3]
endpoint = ""
region = ""
bucket = ""
prefix = "registry"

[features]
allow_tag_overwrite = true
automatic_crossmount = false

[uploads]
# Zero-trust-ish operators often set this to true.
disallow_monolithic_uploads = false

# Upload failure handling defaults (clients may resume uploads unless aborted).
abort_on_error = false
abort_on_digest_mismatch = false

# Filesystem backend maintenance: clean up stale upload temp files.
gc_enabled = true
gc_interval_secs = 3600
gc_max_age_secs = 86400

# Optional per-repo upload behavior overrides.
[[uploads.repos]]
match = "myrepo"
abort_on_error = false
abort_on_digest_mismatch = true

[limits]
max_upload_bytes = 5368709120          # 5 GiB
max_request_body_bytes = 33554432      # 32 MiB (manifests are read with a cap)
max_concurrent_buffered_requests = 8   # caps concurrent manifest buffering
max_concurrent_requests = 256          # caps in-flight /v2 requests (uploads excluded)

[timeouts]
request_timeout_secs = 300
upload_request_timeout_secs = 3600

[catalog]
requires_auth = false

# Pull-through cache / proxy (optional)
[proxy]
enabled = true
mode = "any" # "allowlist" or "any"

# Request routing (global / single-upstream mode)
[proxy.routing]
# If the request Host matches any of these patterns, the registry runs in "proxy-only" mode:
# - reads never consult local storage (cache/upstream only)
# - writes are rejected (405)
# Patterns support a minimal '*' glob.
proxy_hosts = [
	"docker-io.thor.kaupon.de",
	"ghcr.thor.kaupon.de",
	"gcr.thor.kaupon.de",
	"k8s-gcr.thor.kaupon.de",
	"registry-k8s.thor.kaupon.de",
	"quay.thor.kaupon.de",
]
trust_x_forwarded_host = false

# Single-upstream mode (optional when using [[proxy.upstreams]])
[proxy.upstream]
base_url = ""
username = ""
password = ""

# Safety net / SSRF hardening
[proxy.safety]
allowed_upstream_hosts = []
allowed_repo_prefixes = []
block_private_networks = true
max_concurrent_upstream = 16

[proxy.cache]
index_path = "./data/cache/proxy-index"
fs_root = ""
s3_prefix = ""
max_cache_bytes = 0

gc_interval_secs = 3600
scrub_enabled = false
scrub_interval_secs = 3600
scrub_max_files_per_run = 2000

# Multiple upstream registries / isolated caches (single process)

[[proxy.upstreams]]
hosts = ["docker-io.thor.kaupon.de"]
base_url = "https://registry-1.docker.io"
username = "dietmarkling"
password = "test"
max_cache_bytes = 10737418240

[proxy.upstreams.safety]
# Leave empty to rely on the built-in safe default:
# - allow only the upstream host
# - Bearer token realm host under the same base domain (e.g. auth.docker.io for docker.io)
# allowed_upstream_hosts = []
allowed_repo_prefixes = ["library/"]
block_private_networks = true
max_concurrent_upstream = 16

[proxy.upstreams.cache]
