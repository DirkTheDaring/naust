# Multi-upstream mode (optional)
# [[proxy.upstreams]]
# hosts = ["docker.example.com"]
# base_url = "https://registry-1.docker.io"
# username = ""
# password = ""
# max_cache_bytes = 10737418240
#
# [proxy.upstreams.routing]
# hosts = ["docker.example.com"]
# trust_x_forwarded_host = false
#
# [proxy.upstreams.upstream]
# base_url = "https://registry-1.docker.io"
# username = ""
# password = ""
#
# [proxy.upstreams.safety]
# allowed_upstream_hosts = ["registry-1.docker.io"]
# allowed_repo_prefixes = ["library/"]
# block_private_networks = true
# max_concurrent_upstream = 16
# Redirect handling:
# - any_public (default): follow HTTPS:443 redirects with private-network blocking (needed for Docker Hub blobs)
# - same_host: only follow redirects that stay on the upstream host
# - disabled: do not follow redirects
# redirect_policy = "any_public"
#
# [proxy.upstreams.cache]
# index_path = "./data/cache/proxy-index-docker"
# fs_root = "./data/cache/docker"
# s3_prefix = ""
# max_cache_bytes = 10737418240

