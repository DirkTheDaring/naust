# Example: Harbor-lite users + groups (config-only).
#
# This file is intended as a minimal starting point for using:
# - [auth.users] + [[auth.users.accounts]]
# - [[auth.groups]]
#
# Generate Argon2id hashes using the CLI helper (see docs/rbac.md).

[server]
listen_addr = "127.0.0.1:5000"
public_url = "http://127.0.0.1:5000"

[token]
service = "registry-rust"
# Set a stable secret in production.
signing_key = "change-me"
ttl_secs = 600

[storage]
backend = "fs"

[storage.fs]
root = "./data"

# Online blob GC (admin API, filesystem backend only)
#
# Disabled by default; enable in staged steps:
# 1) enabled=true (allows quarantine)
# 2) observe and validate
# 3) enable_delete=true (allows delete)
#
# [blob_gc]
# enabled = false
# enable_delete = false
# finalize_grace_secs = 259200 # 72h
# default_min_age_secs = 604800             # 7d
# default_quarantine_delay_secs = 86400     # 24h
# default_max_blobs = 1000
# default_max_bytes = 9223372036854775807  # i64::MAX (TOML ints are i64)
# default_max_seconds = 60
# schedule_enabled = false
# schedule_interval_secs = 604800 # 7d
#
# [admin_api]
# enabled = false
# username = "admin"
# password = "change-me"

[auth]
# Authentication transport mechanism:
# - "token" (default): strictly advertises and requires Docker/OCI token endpoints.
# - "basic": advertises and requires standard HTTP Basic Auth for pushes/pulls. 
# - "both": advertises and accepts both methods.
# strategy = "token"

# Allow unauthenticated users to download images?
# Default is true (backward compatible).
# If set to false, ALL pulls and API reads will require authentication.
# anonymous_pull = true

# Harbor-lite Phase 2 (implemented): users + groups.
[auth.users]
enabled = true

[[auth.users.accounts]]
name = "alice"
# Replace with an actual Argon2id hash.
secret_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# Group membership
groups = ["devs"]
# Optional per-user TTL cap
max_ttl_secs = 600

[[auth.groups]]
name = "devs"
grants = [
  { repo_prefix = "org1/", actions = ["pull", "push"] },
]
