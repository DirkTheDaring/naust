# Best-practice configuration (security/robustness oriented)
#
# Intended posture:
# - Stable token signing key (required)
# - Catalog/meta endpoints require auth
# - Monolithic uploads rejected (force PATCH-based chunking)
# - No tag overwrite
# - Separate upload timeout

[profile]
name = "best_practice"

[server]
listen_addr = "0.0.0.0:5000"
public_url = "https://registry.example.com"

[server.tls]
cert_path = "/certs/cert.pem"
key_path  = "/certs/key.pem"

[auth.push]
mode = "basic_or_token"
username = "demo"
password = "demo"
# allow_repos = ["org/*"]

[token]
service = "registry-rust"
# MUST be set to a long random secret for real deployments.
signing_key = "REPLACE_ME_WITH_LONG_RANDOM_SECRET"
ttl_secs = 600

[storage]
backend = "fs"

# Persistent blob reference index (sled on local disk).
# Enabled by default even if you omit this block.
[storage.ref_index]
enabled = true
# path = "/data/ref-index"
# rebuild_on_start = false
# auto_rebuild_on_corruption = true

# Online blob GC (in-process, safe-by-default)
#
# This is the *online* GC described in docs/blob-gc-online.md, driven via admin-only HTTP endpoints.
# It is disabled by default; enable in staged steps:
# 1) enable=true (allows quarantine)
# 2) observe and validate
# 3) enable_delete=true (allows delete)
[blob_gc]
# enabled: allows the *quarantine* phase (moves unreferenced blobs from live -> quarantine).
# When false: admin GC "plan" remains available, but quarantine/delete are blocked.
# enabled = false
# enable_delete: additionally allows the *delete* phase (permanently deletes old quarantined blobs).
# When false: /_admin/gc/delete is blocked and scheduled cleanup (if enabled) will quarantine only.
# enable_delete = false
#
# Safety: newly finalized blobs are pinned for at least this long.
# finalize_grace_secs = 259200 # 72h
#
# Default policy knobs (used by admin endpoints if omitted in request JSON)
# default_min_age_secs = 604800             # 7d
# default_quarantine_delay_secs = 86400     # 24h
#
# Default per-run budgets (used by admin endpoints if omitted)
# default_max_blobs = 1000
# default_max_bytes = 9223372036854775807  # i64::MAX (TOML ints are i64)
# default_max_seconds = 60

# Optional periodic online GC (disabled by default)
# When enabled, the server will run a quarantine pass every interval and (if enable_delete=true)
# a delete pass immediately after.
# schedule_enabled = false
# schedule_interval_secs = 604800 # 7d

# Admin-only HTTP endpoints for online blob GC (disabled by default)
[admin_api]
# enabled = false
# username = "admin"
# password = "change-me"

[storage.fs]
root = "/data"

[features]
allow_tag_overwrite = false
automatic_crossmount = false

[uploads]
disallow_monolithic_uploads = true
gc_enabled = true
gc_interval_secs = 3600
# Consider increasing if you expect long pauses in uploads.
gc_max_age_secs = 86400

[limits]
# Set according to your capacity and risk tolerance.
max_upload_bytes = 1099511627776       # 1 TiB
max_request_body_bytes = 33554432
max_concurrent_buffered_requests = 4
max_concurrent_requests = 64

[timeouts]
# Normal API calls should fail fast.
request_timeout_secs = 60
# Long transfers need a longer per-request timeout; chunked PATCH keeps individual requests bounded.
upload_request_timeout_secs = 7200

[catalog]
requires_auth = true
