# Example configuration file for registry-rust
# Usage:
#   ./registry-rust server --config /etc/registry/registry.toml
#   # (equivalently: CONFIG_PATH=/etc/registry/registry.toml ./registry-rust server)
# Precedence:
#   defaults < config file < env vars

[profile]
# Optional: "best_practice" changes defaults and makes token.signing_key required.
# name = "best_practice"
name = ""

[server]
listen_addr = "127.0.0.1:5000"
# Recommended for token realm and external URLs (especially behind proxies)
public_url = "http://127.0.0.1:5000"

[server.tls]
# If both are set, the server serves HTTPS.
cert_path = ""
key_path  = ""

[auth.push]
# If username/password are unset, pushes are rejected.
username = "demo"
password = "demo"
# Optional allowlist; supports "org/*" and "*".
allow_repos = ["*"]

# Implemented: robot accounts + scoped grants (Harbor-style RBAC lite)
#
# Security note: avoid storing plaintext secrets in config. Use hashed secrets (Argon2id).
# This block is commented out so it won't trip strict config parsing.
#
# [auth.robots]
# enabled = true
#
# [[auth.robots.accounts]]
# name = "ci"
# secret_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# grants = [
#   { repo_prefix = "org1/", actions = ["pull","push"] },
#   { repo_prefix = "library/", actions = ["pull"] },
# ]
# max_ttl_secs = 600

# Implemented (Harbor-lite Phase 2): human users + groups (no DB, config-only).
#
# [auth.users]
# enabled = true
#
# [[auth.users.accounts]]
# name = "alice"
# secret_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# groups = ["devs"]
# max_ttl_secs = 600
#
# [[auth.groups]]
# name = "devs"
# grants = [
#   { repo_prefix = "org1/", actions = ["pull","push"] },
# ]

[token]
service = "registry-rust"
# Set a stable secret in production.
# Overlap key rotation (recommended): provide multiple keys.
# - The FIRST entry is the primary key used to mint new tokens.
# - All entries are accepted for verification, so you can rotate without breaking in-flight tokens.
[[token.signing_keys]]
kid = "k2026_01"
key = "change-me-primary"

[[token.signing_keys]]
kid = "k2025_12"
key = "change-me-secondary"

# Legacy single-key config (still supported):
# signing_key = "change-me"
ttl_secs = 600

[storage]
backend = "fs"  # "fs" or "s3"

[storage.fs]
root = "./data"

[storage.s3]
endpoint = ""
region = ""
bucket = ""
prefix = "registry"

[features]
allow_tag_overwrite = true
automatic_crossmount = false

[uploads]
# Zero-trust-ish operators often set this to true.
disallow_monolithic_uploads = false

# Upload failure handling defaults (clients may resume uploads unless aborted).
abort_on_error = false
abort_on_digest_mismatch = false

# Optional per-repo upload behavior overrides.
[[uploads.repos]]
match = "myrepo"
abort_on_error = false
abort_on_digest_mismatch = true

# Filesystem backend maintenance: clean up stale upload temp files.
gc_enabled = true
gc_interval_secs = 3600
gc_max_age_secs = 86400

[limits]
max_upload_bytes = 5368709120          # 5 GiB
max_request_body_bytes = 33554432      # 32 MiB (manifests are read with a cap)
max_concurrent_buffered_requests = 8   # caps concurrent manifest buffering
max_concurrent_requests = 256          # caps in-flight /v2 requests (uploads excluded)

[timeouts]
request_timeout_secs = 300
upload_request_timeout_secs = 3600

[catalog]
requires_auth = false

# Pull-through cache / proxy (optional)
[proxy]
enabled = true
mode = "any" # "allowlist" or "any"

# Request routing (global / single-upstream mode)
[proxy.routing]
# If the request Host matches any of these patterns, the registry runs in "proxy-only" mode:
# - reads never consult local storage (cache/upstream only)
# - writes are rejected (405)
# Patterns support a minimal '*' glob.
proxy_hosts = []
# Set true only when behind a trusted reverse proxy and clients cannot spoof forwarded headers.
trust_x_forwarded_host = false

# Proxy safety settings (global defaults, used unless overridden per-upstream)
[proxy.safety]
# If empty, defaults to allowing only the configured upstream host (plus auth.docker.io for Docker Hub).
allowed_upstream_hosts = []
# If empty, all repos are allowed by this *safety* check; allowlist/any mode still applies.
allowed_repo_prefixes = []
block_private_networks = true
max_concurrent_upstream = 16

# Single-upstream mode (optional / legacy): configure ONE upstream here.
# If you configure `[[proxy.upstreams]]` below, this is typically left unused.
[proxy.upstream]
base_url = ""
username = ""
password = ""

# Single-upstream cache settings (used only when proxy.upstreams is empty)
[proxy.cache]
# Separate cache storage root to avoid mixing push content with cached pull-through content.
fs_root = ""
s3_prefix = ""
# Local metadata DB for tag freshness (TTL/ETag). Defaults to <fs_root>/proxy-index.
index_path = ""
# Required when proxy.enabled=true AND using single-upstream mode.
max_cache_bytes = 10737418240 # 10 GiB
gc_interval_secs = 3600

# Optional: periodically scan cached manifests/tags and delete corrupted entries.
scrub_enabled = false
scrub_interval_secs = 3600
scrub_max_files_per_run = 2000

# Multiple upstream registries / isolated caches (single process)

[[proxy.upstreams]]
hosts = ["dockerhub-cache.local"]
base_url = "https://registry-1.docker.io"
max_cache_bytes = 10737418240

# Optional: per-upstream routing behavior (behind trusted reverse proxies)
# trust_x_forwarded_host = true

# Optional: per-upstream credentials
# username = "my-docker-id"
# password = "my-dockerhub-pat"

# Optional: per-upstream safety overrides (otherwise proxy.safety.* defaults apply)
[proxy.upstreams.safety]
allowed_upstream_hosts = []
allowed_repo_prefixes = ["library/"]
block_private_networks = true
max_concurrent_upstream = 16

# Optional: per-upstream cache location overrides
[proxy.upstreams.cache]
# Filesystem backend: fs_root/index_path are optional; defaults are derived from base_url,
# e.g. ./data/cache/registry-1.docker.io/ (filesystem backend)
fs_root = ""
index_path = ""
# S3 backend: s3_prefix is optional; defaults are derived from base_url.
s3_prefix = ""
max_cache_bytes = 10737418240

[[proxy.upstreams]]
hosts = ["ghcr-cache.local"]
base_url = "https://ghcr.io"
max_cache_bytes = 10737418240

# Optional: per-upstream cache overrides (same keys as above)
[proxy.upstreams.cache]
fs_root = ""
index_path = ""
s3_prefix = ""
max_cache_bytes = 10737418240

# Per-repo policies (TOML-only)
# These apply to proxy behavior (cache freshness + eviction) and are shared across upstreams.

[[proxy.repos]]
match = "library/alpine"
# tag_policy = "digest_only" | { ttl_seconds = 3600 } | "always_revalidate"
tag_policy = "digest_only"
eviction = { type = "default" }

[[proxy.repos]]
match = "library/nginx"
tag_policy = { ttl_seconds = 3600 }
eviction = { type = "keep_tags", tags = ["latest"] }

[[proxy.repos]]
match = "myorg/*"
tag_policy = "always_revalidate"
# Keep highest SemVer tag among cached tags (optionally filter by regex)
eviction = { type = "keep_latest_cached_semver", tag_regex = "^v?\\d+\\.\\d+\\.\\d+$", allow_prerelease = false }

# Optional: rewrite local repo -> upstream repo name (useful for mirroring)
[[proxy.repos]]
match = "myrepo"
upstream_repo = "library/alpine"
tag_policy = { ttl_seconds = 600 }
eviction = { type = "default" }
