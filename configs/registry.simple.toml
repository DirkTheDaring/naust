# Minimal, working configuration (proxy + multi-upstream) intended to be hard to misconfigure.

[profile]
name = "best_practice"

[server]
listen_addr = "127.0.0.1:5000"

[token]
service = "registry-rust"
# Set a stable secret in production.
signing_key = "change-me"
ttl_secs = 600

[storage]
backend = "fs"

[storage.fs]
root = "./data"

# Online blob GC (admin API, filesystem backend only)
#
# Disabled by default; enable in staged steps:
# 1) enabled=true (allows quarantine)
# 2) observe and validate
# 3) enable_delete=true (allows delete)
#
# [blob_gc]
# enabled = false
# enable_delete = false
# finalize_grace_secs = 259200 # 72h
# default_min_age_secs = 604800             # 7d
# default_quarantine_delay_secs = 86400     # 24h
# default_max_blobs = 1000
# default_max_bytes = 9223372036854775807  # i64::MAX (TOML ints are i64)
# default_max_seconds = 60
# schedule_enabled = false
# schedule_interval_secs = 604800 # 7d
#
# [admin_api]
# enabled = false
# username = "admin"
# password = "change-me"

[proxy]
enabled = true
mode = "any"

# Upstreams can be declared using inline tables.
# Each entry must define:
# - hosts: which inbound hosts select this upstream route
# - base_url: upstream registry base URL
# - max_cache_bytes: cache cap for that upstream route
upstreams = [
  { hosts = ["docker.io"], base_url = "https://registry-1.docker.io", max_cache_bytes = 10737418240 },
  { hosts = ["ghcr.io"], base_url = "https://ghcr.io", max_cache_bytes = 10737418240 },
]
