[package]
name = "acmecert-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

description = "Core library for acmecert (ACME DNS-01 provisioning + hooks)"
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
instant-acme = { version = "0.7", features = ["hyper-rustls"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
thiserror = "1"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
url = "2"
x509-parser = "0.16"

[features]
default = []

## Serialization helpers for IssuedCertificate
format-json = ["dep:serde", "dep:serde_json"]
format-yaml = ["dep:serde", "dep:serde_yaml"]
