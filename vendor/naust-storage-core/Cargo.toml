[package]
name = "naust-storage-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DirkTheDaring/naust-storage-core"
description = "Domain-free core storage contracts and primitives"

[dependencies]
async-trait = "0.1"
bytes = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util"] }

[features]
contract-tests = []

[[test]]
name = "contract_suite"
required-features = ["contract-tests"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
