[package]
name = "naust-auth"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DirkTheDaring/naust"
description = "Pure authentication, token issuance/verification, password hashing, and RBAC primitives for Naust."

[dependencies]
argon2 = { version = "0.5", features = ["password-hash", "std"] }
base64 = "0.22"
hmac = "0.12"
naust-types = { path = "../naust-types" }
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
