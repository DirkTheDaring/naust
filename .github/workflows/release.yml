name: release

# Publish the container image when a version tag is pushed. The image does
# not contain a signing key; the operator sets TOKEN_SIGNING_KEY at run time.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker build -t "$IMAGE:${{ github.ref_name }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:latest"
