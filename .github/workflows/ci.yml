name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Smoke test
        env:
          CARGO_TARGET_DIR: target
          REGISTRY_USERNAME: demo
          REGISTRY_PASSWORD: demo
        run: scripts/smoke.sh

      - name: MinIO (S3 backend) smoke test
        env:
          REGISTRY_USERNAME: demo
          REGISTRY_PASSWORD: demo
        run: scripts/minio-smoke.sh

      - name: Podman smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y podman openssl
          CARGO_TARGET_DIR=target REGISTRY_USERNAME=demo REGISTRY_PASSWORD=demo scripts/podman-smoke.sh
