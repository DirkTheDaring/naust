name: ci

# Hosted pipeline. Sibling crates are path dependencies; CI compiles the
# copies under vendor/ (refresh with `make vendor-sync` before a release).

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Sibling path-deps are vendored; stage them where the manifests expect them.
      - name: Stage vendored path dependencies
        run: |
          mkdir -p ../acmecert ../naust-storage-core ../naust-storage-fs ../naust-storage-s3 ../naust-core ../naust-auth ../naust-types
          cp -a vendor/acmecert/. ../acmecert/
          cp -a vendor/naust-storage-core/. ../naust-storage-core/
          cp -a vendor/naust-storage-fs/. ../naust-storage-fs/
          cp -a vendor/naust-storage-s3/. ../naust-storage-s3/
          cp -a vendor/naust-core/. ../naust-core/
          cp -a vendor/naust-auth/. ../naust-auth/
          cp -a vendor/naust-types/. ../naust-types/
      - name: Format
        run: cargo fmt --all --check
      - name: Packaging and deploy contract
        run: make packaging-check
      - name: Core boundary gate (ADR-010)
        run: make core-boundary
      - name: naust-types tests (sibling path dependency)
        run: cargo test --locked --no-fail-fast --manifest-path ../naust-types/Cargo.toml
      - name: naust-auth tests (sibling path dependency)
        run: cargo test --locked --no-fail-fast --manifest-path ../naust-auth/Cargo.toml
      - name: naust-storage-core tests (sibling path dependency)
        run: cargo test --locked --no-fail-fast --manifest-path ../naust-storage-core/Cargo.toml
      - name: naust-storage-fs tests (sibling path dependency)
        run: cargo test --locked --no-fail-fast --manifest-path ../naust-storage-fs/Cargo.toml
      - name: naust-storage-s3 tests (sibling path dependency)
        run: cargo test --locked --no-fail-fast --manifest-path ../naust-storage-s3/Cargo.toml
      - name: naust-core tests (sibling path dependency)
        run: cargo test --locked --no-fail-fast --manifest-path ../naust-core/Cargo.toml
      - name: Server tests (the live-S3 suite is ignore-gated; see the live-s3 job)
        run: cargo test --locked --no-fail-fast
      - name: Conformance (fs, basic, token)
        run: tests/compliance/run.sh fs basic token

  live-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage vendored path dependencies
        run: |
          mkdir -p ../acmecert ../naust-storage-core ../naust-storage-fs ../naust-storage-s3 ../naust-core ../naust-auth ../naust-types
          cp -a vendor/acmecert/. ../acmecert/
          cp -a vendor/naust-storage-core/. ../naust-storage-core/
          cp -a vendor/naust-storage-fs/. ../naust-storage-fs/
          cp -a vendor/naust-storage-s3/. ../naust-storage-s3/
          cp -a vendor/naust-core/. ../naust-core/
          cp -a vendor/naust-auth/. ../naust-auth/
          cp -a vendor/naust-types/. ../naust-types/
      # MinIO's official images no longer allow anonymous pulls (docker.io and
      # quay.io both deny); the frozen bitnami legacy archive still does and is
      # env-configured (no command needed). Pinned by digest.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 2
          done
          echo "MinIO did not become ready" >&2; docker logs minio; exit 1
      - name: Live S3 suite
        run: cargo test --locked --test s3_live_integration -- --ignored --test-threads=1
      - name: Conformance (s3)
        run: tests/compliance/run.sh s3
