name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Smoke test
        env:
          CARGO_TARGET_DIR: target
          REGISTRY_USERNAME: demo
          REGISTRY_PASSWORD: demo
        run: scripts/smoke.sh

      - name: MinIO Live S3 contract test suite
        env:
          TEST_S3_ENDPOINT: "http://127.0.0.1:9000"
          TEST_S3_REGION: "us-east-1"
          TEST_S3_BUCKET: "registry-live-test"
          AWS_ACCESS_KEY_ID: "minioadmin"
          AWS_SECRET_ACCESS_KEY: "minioadmin"
        run: |
          scripts/start-minio.sh
          cargo test --test s3_live_integration -- --nocapture

      - name: MinIO (S3 backend) smoke test
        env:
          REGISTRY_USERNAME: demo
          REGISTRY_PASSWORD: demo
        run: scripts/minio-smoke.sh

      - name: Podman smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y podman openssl
          CARGO_TARGET_DIR=target REGISTRY_USERNAME=demo REGISTRY_PASSWORD=demo scripts/podman-smoke.sh

  oci-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Start MinIO
        run: scripts/start-minio.sh

      - name: Run OCI Distribution v1.1.1 Conformance (FS and S3)
        run: scripts/oci-conformance.sh

      - name: Upload Conformance Artifacts (All Matrices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-conformance-results
          path: conformance-results/**
