name: ci

# Real pipeline definition (remediation R6). NOTE (KI-19/GATE-O13): this
# repository has no remote yet, so this workflow has never executed on a
# hosted runner; it mirrors the local verification commands exactly.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Sibling path-deps are vendored; stage them where the manifests expect them.
      - name: Stage vendored path dependencies
        run: |
          mkdir -p ../acmecert ../storage-layer-rust
          cp -a vendor/acmecert/. ../acmecert/
          cp -a vendor/storage-layer-rust/. ../storage-layer-rust/
      - name: Format
        run: cargo fmt --all --check
      - name: Core boundary gate (ADR-010)
        run: make core-boundary
      - name: Workspace tests (live-S3 suite runs in its own job)
        run: cargo test --workspace --locked --no-fail-fast -- --skip test_live_s3
      - name: Conformance (fs, basic, token)
        run: tests/compliance/run.sh fs basic token

  live-s3:
    runs-on: ubuntu-latest
    # GitHub service containers cannot pass a command, and the official
    # minio/minio image requires `server /data`; bitnami's image is
    # env-configured and needs none.
    services:
      minio:
        image: bitnami/minio:latest
        ports: ['9000:9000']
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/ready"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage vendored path dependencies
        run: |
          mkdir -p ../acmecert ../storage-layer-rust
          cp -a vendor/acmecert/. ../acmecert/
          cp -a vendor/storage-layer-rust/. ../storage-layer-rust/
      - name: Live S3 suite
        run: cargo test --locked --test s3_live_integration -- --test-threads=1
      - name: Conformance (s3)
        run: tests/compliance/run.sh s3
