name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Smoke test
        env:
          CARGO_TARGET_DIR: target
          REGISTRY_USERNAME: demo
          REGISTRY_PASSWORD: demo
        run: scripts/smoke.sh

      - name: MinIO (S3 backend) smoke test
        env:
          REGISTRY_USERNAME: demo
          REGISTRY_PASSWORD: demo
        run: scripts/minio-smoke.sh

      - name: Podman smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y podman openssl
          CARGO_TARGET_DIR=target REGISTRY_USERNAME=demo REGISTRY_PASSWORD=demo scripts/podman-smoke.sh

  oci-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build registry
        run: cargo build

      - name: Start registry (for conformance)
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          echo "OCI_REGISTRY_DATA_DIR=${data_dir}" >> "$GITHUB_ENV"

          REGISTRY_USERNAME=demo \
          REGISTRY_PASSWORD=demo \
          REGISTRY_PUSH_ALLOW_REPOS='*' \
          STORAGE_BACKEND=fs \
          STORAGE_FS_ROOT="${data_dir}" \
          ALLOW_TAG_OVERWRITE=1 \
          PUBLIC_URL='http://127.0.0.1:5000' \
          RUST_LOG='info' \
          ./target/debug/registry-rust &

          echo "OCI_REGISTRY_PID=$!" >> "$GITHUB_ENV"

          for _ in {1..60}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/ || true)
            if [[ "$code" == "200" || "$code" == "401" ]]; then
              exit 0
            fi
            sleep 0.5
          done
          echo "registry did not start" >&2
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Run OCI Distribution conformance (black-box)
        uses: opencontainers/distribution-spec@v1.1.0
        env:
          OCI_ROOT_URL: http://127.0.0.1:5000
          OCI_NAMESPACE: conformance/myrepo
          OCI_USERNAME: demo
          OCI_PASSWORD: demo

          OCI_TEST_PULL: 1
          OCI_TEST_PUSH: 1
          OCI_TEST_CONTENT_DISCOVERY: 1
          OCI_TEST_CONTENT_MANAGEMENT: 1

          OCI_HIDE_SKIPPED_WORKFLOWS: 1
          OCI_DEBUG: 0
          OCI_DELETE_MANIFEST_BEFORE_BLOBS: 1

      - name: Stop registry
        if: always()
        shell: bash
        run: |
          kill "${OCI_REGISTRY_PID:-}" 2>/dev/null || true
