services:
  registry:
    build: .
    ports:
      - "5000:5000"
    environment:
      RUST_LOG: "info,tower_http=debug"
      PUBLIC_URL: "http://127.0.0.1:5000"
      # Optional: set a stable signing key so tokens remain valid across restarts.
      # TOKEN_SIGNING_KEY: "change-me"
      # Set credentials to enable pushes.
      REGISTRY_USERNAME: "demo"
      REGISTRY_PASSWORD: "demo"

      # Optional: allow pushes only to specific repos (comma-separated).
      # Examples: "myrepo", "org/*", "*"
      REGISTRY_PUSH_ALLOW_REPOS: "myrepo"

      # Data/config
      STORAGE_BACKEND: "fs"
      STORAGE_FS_ROOT: "/data"
      ALLOW_TAG_OVERWRITE: "1"
      MAX_UPLOAD_BYTES: "5368709120"
      MAX_REQUEST_BODY_BYTES: "33554432"
      REQUEST_TIMEOUT_SECS: "300"

    volumes:
      - registry-data:/data

    # S3 mode (backend is currently stubbed/not implemented):
    # environment:
    #   STORAGE_BACKEND: "s3"
    #   STORAGE_S3_ENDPOINT: "https://s3.example.com"
    #   STORAGE_S3_REGION: "us-east-1"
    #   STORAGE_S3_BUCKET: "my-bucket"
    #   STORAGE_S3_PREFIX: "registry"

volumes:
  registry-data: {}
