services:
  registry:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      RUST_LOG: "info,tower_http=debug"
      PUBLIC_URL: "http://127.0.0.1:5000"
      # Local-only signing key so `serve` starts. Replace this before any
      # deploy that is not bound to loopback (ADR-017).
      TOKEN_SIGNING_KEY: "local-dev-signing-key-not-for-production"

      # Push is off until you set credentials. Example:
      # REGISTRY_USERNAME: "demo"
      # REGISTRY_PASSWORD: "change-me"
      # REGISTRY_PUSH_ALLOW_REPOS: "myrepo"

      # Data/config
      STORAGE_BACKEND: "fs"
      STORAGE_FS_ROOT: "/data"
      ALLOW_TAG_OVERWRITE: "1"
      MAX_UPLOAD_BYTES: "5368709120"
      MAX_REQUEST_BODY_BYTES: "33554432"
      REQUEST_TIMEOUT_SECS: "300"

    volumes:
      - registry-data:/data

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

    # S3 mode (backend implemented). For local testing with MinIO, see
    # docker-compose.minio.yml and scripts/minio-smoke.sh.
    # environment:
    #   STORAGE_BACKEND: "s3"
    #   STORAGE_S3_ENDPOINT: "https://s3.example.com"
    #   STORAGE_S3_REGION: "us-east-1"
    #   STORAGE_S3_BUCKET: "my-bucket"
    #   STORAGE_S3_PREFIX: "registry"

volumes:
  registry-data: {}
